name: Function tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript (${{ matrix.timezone }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Australia/Brisbane, America/New_York]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Run tracked JavaScript tests
        run: |
          mapfile -d '' -t tests < <(git ls-files -z '*.test.cjs' '*/test_*.cjs' 'test_*.cjs')
          test "${#tests[@]}" -gt 0
          node --test --test-reporter=spec "${tests[@]}"

  python:
    name: Python functions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run tracked Python tests
        run: |
          mapfile -d '' -t tests < <(git ls-files -z '*/test_*.py' 'test_*.py' '*_test.py')
          test "${#tests[@]}" -gt 0
          python -m pytest "${tests[@]}"
